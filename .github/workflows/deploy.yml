# Push-to-deploy: every push to main rebuilds and restarts the VPS stack.
# Required GitHub secrets (repo Settings → Secrets and variables → Actions):
#   VPS_HOST     — VPS IP, e.g. 187.77.132.246
#   VPS_USER     — ssh user, e.g. root
#   VPS_SSH_KEY  — private deploy key (see below)
#
# Deploy key setup (run on your PC, NOT on the VPS):
#   ssh-keygen -t ed25519 -f %USERPROFILE%\.ssh\hrms_deploy -N ""
#   -> paste hrms_deploy.pub into the VPS: cat >> /root/.ssh/authorized_keys
#   -> paste hrms_deploy (private) into the VPS_SSH_KEY secret
#
# Notes:
# - Frontend .env.production and server .env.docker live ONLY on the VPS
#   (gitignored) — the VPS build uses those, so secrets never touch GitHub.
# - This never runs the seeder (re-seeding would reset passwords).

name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "deploy/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/dtr
            git fetch origin main
            git reset --hard origin/main
            docker compose --env-file .env.docker up -d --build
            docker compose --env-file .env.docker ps
            echo "--- BACKEND LOGS ---"
            docker compose --env-file .env.docker logs --tail=30 backend || true
            echo "--- FRONTEND LOGS ---"
            docker compose --env-file .env.docker logs --tail=30 frontend || true
            echo "--- NGINX PROXY CONFIG ---"
            grep -rn "proxy_pass" /etc/nginx/sites-enabled/ /etc/nginx/sites-available/ || true
            if [ -f /etc/nginx/sites-available/dtr ]; then
              sed -i 's/127.0.0.1:8080/127.0.0.1:5173/g' /etc/nginx/sites-available/dtr || true
              nginx -t && systemctl reload nginx || true
            fi
