name: Post Deployment Github Repo Deployment Status

on:
  workflow_run:
    workflows: ["Deploy to VPS"]
    types:
      - completed

permissions:
  deployments: write

jobs:
  post-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Create Github Deployment and Set Success
        run: |
          echo "Creating deployment..."
          DEPLOYMENT_RESPONSE=$(curl -s -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/deployments \
            -d '{"ref": "${{ github.ref_name }}", "payload": "{}", "description": "Test deployment", "required_contexts": []}')

          DEPLOYMENT_ID=$(echo "$DEPLOYMENT_RESPONSE" | jq -r '.id')
          if [ -z "$DEPLOYMENT_ID" ] || [ "$DEPLOYMENT_ID" = "null" ]; then
            echo "Create Deployment Failed."
            exit 1
          fi

          echo "Deployment created with ID: $DEPLOYMENT_ID"
          echo "Setting deployment status to success..."
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses \
            -d '{"state": "success", "description": "Deployment succeeded", "environment_url": "${{ vars.DEPLOYMENT_URL }}/check"}'
