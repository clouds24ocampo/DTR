# Host-level nginx for the HRMS subdomain.
# Install: sudo cp deploy/host-nginx.conf /etc/nginx/sites-available/dtr
#          sudo sed -i 's/__DOMAIN__/hrms.yourdomain.com/g' /etc/nginx/sites-available/dtr
#          sudo ln -sf /etc/nginx/sites-available/dtr /etc/nginx/sites-enabled/dtr
# Certbot will add the SSL stanzas automatically (certbot --nginx -d __DOMAIN__).
server {
  listen 80;
  server_name __DOMAIN__;

  # Frontend container (its own nginx serves the SPA + proxies /api/*).
  location / {
    proxy_pass http://127.0.0.1:5173;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Websocket upgrades (Socket.IO) pass through both proxies.
  location /socket.io/ {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
